<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奇幻許願池與智慧女神殿</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e2a4a 0%, #0d1326 100%);
      color: #f8f1e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      overflow-x: hidden;
    }

    /* 頂部導覽列 */
    .top-bar {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #d4af37;
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .back-btn {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #1a120b;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.15s;
    }

    .back-btn:hover {
      transform: scale(1.05);
    }

    .player-status {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #ffd700;
    }

    /* 標題區 */
    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title h1 {
      font-size: 28px;
      color: #ffd700;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
      margin-bottom: 6px;
    }

    .header-title p {
      font-size: 14px;
      color: #cbd5e1;
    }

    /* 雙聖地互動卡片區 */
    .shrine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 720px;
    }

    .shrine-card {
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #94a3b8;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s, border-color 0.2s;
    }

    .shrine-card:hover {
      transform: translateY(-4px);
      border-color: #ffd700;
    }

    .shrine-icon {
      font-size: 64px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.35));
    }

    .shrine-card h2 {
      font-size: 22px;
      color: #fde047;
      margin-bottom: 8px;
    }

    .shrine-desc {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sign {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .btn-sign:hover:not(:disabled) {
      filter: brightness(1.1);
    }

    .btn-fortune {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
    }

    .btn-fortune:hover:not(:disabled) {
      filter: brightness(1.1);
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 訊息提示條 */
    .toast-msg {
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #ffd700;
      color: #fde047;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      display: none;
      max-width: 720px;
      width: 100%;
      line-height: 1.6;
    }

    /* =========================================
       神諭詩籤 3D 翻轉大彈窗
       ========================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* 3D 翻轉容器 */
    .fortune-card-scene {
      width: 300px;
      height: 400px;
      perspective: 1100px;
      cursor: pointer;
      user-select: none;
    }

    .fortune-card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.75s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .fortune-card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      border: 4px solid #d4af37;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
    }

    /* 正面：復古羊皮紙 */
    .card-front {
      background: linear-gradient(155deg, #fdf6e3 0%, #f1dec0 100%);
      color: #3b2818;
    }

    .card-header-tag {
      font-size: 13px;
      letter-spacing: 3px;
      color: #7c5836;
      font-weight: bold;
    }

    .luck-badge {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 6px;
      padding: 6px 24px;
      border-radius: 10px;
      background: #8b0000;
      color: #ffd700;
      border: 2px solid #ffd700;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      margin-top: 6px;
    }

    /* 四行詩排版 */
    .poem-lines {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      margin: auto 0;
      color: #2c1a0e;
    }

    /* 背面：神秘星空紫 */
    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(155deg, #2b193d 0%, #160c24 100%);
      color: #f8e8c8;
      border-color: #ffd700;
    }

    .explain-title {
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
      border-bottom: 2px solid rgba(255, 215, 0, 0.35);
      padding-bottom: 10px;
      width: 85%;
      text-align: center;
      letter-spacing: 2px;
    }

    .explain-content {
      font-size: 18px;
      line-height: 2.1;
      text-align: center;
      margin: auto 0;
      padding: 0 6px;
      font-weight: bold;
      color: #fef3c7;
    }

    .flip-hint {
      font-size: 13px;
      font-weight: bold;
      opacity: 0.85;
      animation: pulseHint 1.6s infinite;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    .close-modal-btn {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-modal-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- 頂部狀態列 -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBackTown()">⬅ 返回小鎮</button>
    <div class="player-status">
      <span id="uiNickname">冒險者</span>
      <span>💰 <span id="uiGold">0</span></span>
      <span>🪵 <span id="uiWood">0</span></span>
      <span>🪨 <span id="uiStone">0</span></span>
    </div>
  </div>

  <!-- 頁面標題 -->
  <div class="header-title">
    <h1>⛲ 奇幻許願池與智慧女神殿</h1>
    <p>每日投幣祈福領取資源，向智慧女神求取今日專屬神諭！</p>
  </div>

  <!-- 雙互動卡片 -->
  <div class="shrine-grid">
    <!-- 許願池簽到 -->
    <div class="shrine-card">
      <div class="shrine-icon">⛲</div>
      <h2>星光許願池</h2>
      <p class="shrine-desc">
        每天來許願池報到一次，即可獲得金幣、木材與石頭祝福，累積第 4 天與第 7 天還有超級寶箱大獎！
      </p>
      <button class="action-btn btn-sign" id="btnSign" onclick="handleDailySign()">
        ✨ 每日許願簽到
      </button>
    </div>

    <!-- 智慧女神求籤 -->
    <div class="shrine-card">
      <div class="shrine-icon">🗽</div>
      <h2>智慧女神像</h2>
      <p class="shrine-desc">
        誠心向智慧女神祈求今日運勢詩籤（每日限求一支），點擊詩籤可翻轉查看女神解籤聖意！
      </p>
      <button class="action-btn btn-fortune" id="btnFortune" onclick="handleDrawFortune()">
        🔮 向女神求今日籤
      </button>
    </div>
  </div>

  <!-- 系統提示訊息 -->
  <div class="toast-msg" id="toastMsg"></div>

  <!-- 3D 翻轉詩籤彈窗 -->
  <div class="modal-overlay" id="fortuneModal">
    <div class="fortune-card-scene" onclick="toggleFortuneCard()">
      <div class="fortune-card" id="fortuneCard">
        <!-- 正面：籤運 + 四行詩 -->
        <div class="card-face card-front">
          <div style="text-align: center;">
            <div class="card-header-tag">✦ 智慧女神神諭 ✦</div>
            <div class="luck-badge" id="cardLuck">大吉</div>
          </div>
          <div class="poem-lines" id="cardPoemLines">
            <!-- JS 動態填入 4 行詩句 -->
          </div>
          <div class="flip-hint">👆 點擊詩籤翻轉看解籤</div>
        </div>

        <!-- 背面：女神聖意（解籤） -->
        <div class="card-face card-back">
          <div class="explain-title">📜 女神聖意・解籤</div>
          <div class="explain-content" id="cardExplain">
            <!-- JS 動態填入解籤內容 -->
          </div>
          <div class="flip-hint">👆 點擊翻回詩籤正面</div>
        </div>
      </div>
    </div>

    <button class="close-modal-btn" onclick="closeFortuneModal()">收起神諭詩籤</button>
  </div>

 <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzzAYrRCU8RNzqKA5i5Z9i5KEngeswK4sAN3HKKALkTF4A-IVl-bRQVrfhkSGfKDEDgdA/exec";

    let currentPlayer = null;
    let foundStorage = null;   // localStorage 或 sessionStorage
    let storageKey = "";       // 實際的 key 名稱
    let isWrapped = false;     // 是否包在 .player 裡面

    // 地毯式搜尋 sessionStorage 與 localStorage 裡的玩家存檔
    function loadPlayerFromStorage() {
      const storages = [sessionStorage, localStorage];
      for (const store of storages) {
        for (let i = 0; i < store.length; i++) {
          const k = store.key(i);
          try {
            const parsed = JSON.parse(store.getItem(k));
            if (!parsed || typeof parsed !== "object") continue;

            // 情況 1：直接存 player 物件（含有 studentId 或 classNum+seatNum）
            if (parsed.studentId || (parsed.classNum && parsed.seatNum)) {
              if (!parsed.studentId) {
                parsed.studentId = `${String(parsed.classNum).trim()}_${String(parsed.seatNum).trim().padStart(2, "0")}`;
              }
              foundStorage = store;
              storageKey = k;
              isWrapped = false;
              return parsed;
            }

            // 情況 2：包在 { player: { studentId: ... } } 裡面
            if (parsed.player && (parsed.player.studentId || parsed.player.classNum)) {
              if (!parsed.player.studentId) {
                parsed.player.studentId = `${String(parsed.player.classNum).trim()}_${String(parsed.player.seatNum).trim().padStart(2, "0")}`;
              }
              foundStorage = store;
              storageKey = k;
              isWrapped = true;
              return parsed.player;
            }
          } catch (e) {}
        }
      }
      return null;
    }

    // 寫回原本的儲存位置，確保返回小鎮時資源同步更新
    function savePlayerToStorage() {
      if (!currentPlayer || !foundStorage || !storageKey) return;
      if (isWrapped) {
        try {
          const wrapper = JSON.parse(foundStorage.getItem(storageKey)) || {};
          wrapper.player = currentPlayer;
          foundStorage.setItem(storageKey, JSON.stringify(wrapper));
        } catch (e) {}
      } else {
        foundStorage.setItem(storageKey, JSON.stringify(currentPlayer));
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      currentPlayer = loadPlayerFromStorage();
      if (!currentPlayer) {
        alert("找不到冒險者存檔，請先從大廳登入喔！");
        window.location.href = "index.html";
        return;
      }
      updateTopUI();
    });

    function updateTopUI() {
      if (!currentPlayer) return;
      document.getElementById("uiNickname").textContent = currentPlayer.nickname || currentPlayer.studentId;
      document.getElementById("uiGold").textContent = currentPlayer.gold ?? 0;
      document.getElementById("uiWood").textContent = currentPlayer.wood ?? 0;
      document.getElementById("uiStone").textContent = currentPlayer.stone ?? 0;
    }

    function showToast(text) {
      const el = document.getElementById("toastMsg");
      el.innerHTML = text;
      el.style.display = "block";
    }

    function goBackTown() {
      window.location.href = "town.html";
    }

    // =========================================
    // 動作 1：每日許願池簽到
    // =========================================
    async function handleDailySign() {
      if (!currentPlayer) return;
      const btn = document.getElementById("btnSign");
      btn.disabled = true;
      btn.textContent = "⏳ 許願祈福中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "dailySign",
            studentId: currentPlayer.studentId
          })
        });
        const data = await res.json();

        if (data.success) {
          currentPlayer.gold = data.totals.gold;
          currentPlayer.wood = data.totals.wood;
          currentPlayer.stone = data.totals.stone;
          savePlayerToStorage();
          updateTopUI();
          showToast(
            `✨ ${data.rewardTitle}（累積第 ${data.streak} 天）<br>` +
            `獲得：💰+${data.reward.gold}、🪵+${data.reward.wood}、🪨+${data.reward.stone}`
          );
        } else if (data.alreadySigned) {
          showToast(`💧 ${data.message}（目前累積第 ${data.streak} 天）`);
        } else {
          showToast("⚠️ " + (data.message || "簽到失敗"));
        }
      } catch (err) {
        showToast("⚠️ 連線失敗，請檢查網路狀態");
      } finally {
        btn.disabled = false;
        btn.textContent = "✨ 每日許願簽到";
      }
    }

    // =========================================
    // 動作 2：智慧女神求籤（支援三欄＋3D翻卡）
    // =========================================
    async function handleDrawFortune() {
      if (!currentPlayer) return;
      const btn = document.getElementById("btnFortune");
      btn.disabled = true;
      btn.textContent = "🔮 感應神諭中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "drawFortune",
            studentId: currentPlayer.studentId,
            nickname: currentPlayer.nickname
          })
        });
        const data = await res.json();

        if (data.success) {
          if (data.alreadyDrawn) {
            showToast("💡 今日已向女神求過籤囉！為你重新展開今日神諭（點擊卡片可翻面解籤）。");
          } else {
            showToast("✨ 智慧女神降下今日神諭！點擊詩籤可翻轉查看解籤。");
          }
          renderFortuneCard(data);
        } else {
          showToast("⚠️ " + (data.message || "求籤失敗"));
        }
      } catch (err) {
        showToast("⚠️ 連線失敗，請檢查網路狀態");
      } finally {
        btn.disabled = false;
        btn.textContent = "🔮 向女神求今日籤";
      }
    }

    // 渲染詩籤卡並打開彈窗
    function renderFortuneCard(data) {
      const card = document.getElementById("fortuneCard");
      card.classList.remove("is-flipped");

      const luckEl = document.getElementById("cardLuck");
      const luckText = data.level || data.luck || "中吉";
      luckEl.textContent = luckText;
      luckEl.style.background = luckText.includes("凶") ? "#1e293b" : "#8b0000";

      const lines = (data.poem || "")
        .split(/[，。]/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

      const poemContainer = document.getElementById("cardPoemLines");
      poemContainer.innerHTML = lines.map(line => `<div>${line}</div>`).join("");

      const explainEl = document.getElementById("cardExplain");
      const explainText = data.explain || "功名（平穩）、財運（安穩）、宜（平常心）、忌（急躁）";
      explainEl.innerHTML = explainText.replace(/、/g, "<br>");

      document.getElementById("fortuneModal").classList.add("active");
    }

    function toggleFortuneCard() {
      document.getElementById("fortuneCard").classList.toggle("is-flipped");
    }

    function closeFortuneModal() {
      document.getElementById("fortuneModal").classList.remove("active");
    }
  </script>
</body>
</html>
