<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學奇幻小鎮 - 中央許願池</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <style>
    body { background: #120d0a; color: #f3e5ab; margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
    .rpg-panel { background: linear-gradient(145deg, #2b1d14, #1c120c); border: 3px solid #c89d54; box-shadow: 0 10px 25px rgba(0,0,0,0.85); }
    .oracle-scroll {
      background: radial-gradient(circle at top, #3b2718 0%, #22150d 65%, #160d08 100%);
      border: 3px solid #e5b567;
      box-shadow: 0 0 35px rgba(255, 215, 100, 0.35), 0 18px 40px rgba(0, 0, 0, 0.9);
    }
    .rpg-btn { background: linear-gradient(180deg, #e5b567, #b88232); border: 2px solid #fff2cc; color: #231409; font-weight: 900; }
    .hotspot { position: absolute; cursor: pointer; border-radius: 12px; transition: background 0.2s, box-shadow 0.2s; z-index: 10; }
    .hotspot:hover { background: rgba(255, 223, 100, 0.18); box-shadow: 0 0 18px rgba(255, 215, 0, 0.55); }
    .hotspot-label { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-6px); background: rgba(25,16,10,0.92); border: 1.5px solid #e5b567; color: #ffea9f; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .hotspot:hover .hotspot-label { opacity: 1; }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">
  <!-- 全螢幕等比例許願池插畫底圖 -->
  <img id="img-fountain" src="fountain.png" alt="中央許願池" class="w-full h-full object-contain" />
  <div id="fountain-layer" class="absolute"></div>

  <!-- 右上角資源狀態列 -->
  <div class="absolute top-3 right-3 pointer-events-none z-20">
    <div class="rpg-panel pointer-events-auto px-4 py-2 rounded-xl flex items-center gap-4 text-sm">
      <span class="text-amber-400 font-black" id="hud-name">勇者</span>
      <span>🪙 <b id="hud-gold">0</b></span>
      <span>🪵 <b id="hud-wood">0</b></span>
      <span>🪨 <b id="hud-stone">0</b></span>
    </div>
  </div>

  <!-- 1. 許願池每日簽到結果卡片（下方進度條橫幅） -->
  <div id="fountain-result" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 rpg-panel px-6 py-4 rounded-2xl max-w-md w-[90%] text-center z-40">
    <div id="fountain-res-badge" class="inline-block px-3 py-0.5 rounded-full text-xs font-black bg-amber-500 text-stone-950 mb-1.5">每日簽到</div>
    <h3 id="fountain-res-title" class="text-lg font-black text-amber-300 mb-1">標題</h3>
    <p id="fountain-res-desc" class="text-sm text-amber-100 leading-relaxed mb-3">內容</p>
    <div id="streak-bar" class="hidden grid grid-cols-7 gap-1.5 mb-3 text-xs font-black"></div>
    <button onclick="document.getElementById('fountain-result').classList.add('hidden')" class="rpg-btn px-5 py-1.5 rounded-lg text-xs cursor-pointer">收下祝福</button>
  </div>

  <!-- 2. 智慧女神神諭卷軸大彈窗（與左側智慧女神像等大，可容納長篇詩籤） -->
  <div id="oracle-modal" class="hidden fixed inset-0 bg-black/55 z-40 flex items-center justify-center p-4">
    <div class="oracle-scroll w-full max-w-lg min-h-[64vh] max-h-[82vh] rounded-3xl p-6 md:p-8 flex flex-col justify-between text-center relative">
      <!-- 頂部裝飾與狀態標籤 -->
      <div>
        <div class="text-3xl mb-1">🔮</div>
        <span id="oracle-badge" class="inline-block px-3.5 py-1 rounded-full text-xs font-black bg-amber-500/90 text-stone-950 tracking-wider mb-3">
          智慧女神的今日神諭
        </span>
        <h2 id="oracle-level" class="text-3xl md:text-4xl font-black text-amber-300 tracking-widest drop-shadow mb-3">
          【大吉】
        </h2>
        <div class="w-28 h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto"></div>
      </div>

      <!-- 中央詩籤內容展示區（大字體、寬敞可捲動） -->
      <div class="my-4 flex-1 flex items-center justify-center overflow-y-auto px-2">
        <p id="oracle-poem" class="text-base md:text-xl text-amber-100 font-bold leading-loose whitespace-pre-line tracking-wide">
          水晶球正在凝聚星辰之力...
        </p>
      </div>

      <!-- 底部收起按鈕 -->
      <div class="pt-2 border-t border-amber-500/30">
        <p class="text-[11px] text-amber-300/70 mb-3">✨ 每位冒險者每日限求籤一次，點擊女神像可隨時重溫今日神諭</p>
        <button onclick="document.getElementById('oracle-modal').classList.add('hidden')" class="rpg-btn px-8 py-2.5 rounded-xl text-sm cursor-pointer shadow-lg">
          謹記女神教誨
        </button>
      </div>
    </div>
  </div>

  <script>
    const player = getPlayerSession();
    if (!player) window.location.href = 'index.html';

    let isRequesting = false;

    function updateHUD() {
      document.getElementById('hud-name').textContent = `${player.nickname} (${player.classNum}-${player.seatNum})`;
      document.getElementById('hud-gold').textContent = player.gold;
      document.getElementById('hud-wood').textContent = player.wood;
      document.getElementById('hud-stone').textContent = player.stone;
    }
    updateHUD();

    const FOUNTAIN_HOTSPOTS = [
      { id: "back",    name: "↩ 返回小鎮",                            left: 3.2,  top: 4.0,  width: 17.0, height: 9.0  },
      { id: "goddess", name: "🔮 智慧女神像・查看今日祝福籤",          left: 14.0, top: 11.0, width: 22.0, height: 63.0 },
      { id: "pool",    name: "✨ 中央許願池・點擊池水進行每日簽到",    left: 44.0, top: 24.0, width: 51.0, height: 54.0 }
    ];

    initHotspotLayer('img-fountain', 'fountain-layer', FOUNTAIN_HOTSPOTS, (item) => {
      if (item.id === 'back') {
        window.location.href = 'town.html';
      } else if (item.id === 'goddess') {
        prayToGoddess();
      } else if (item.id === 'pool') {
        wishAtFountain();
      }
    });

    function renderStreakBar(streak) {
      const bar = document.getElementById('streak-bar');
      bar.classList.remove('hidden');
      bar.innerHTML = [1, 2, 3, 4, 5, 6, 7].map(day => {
        const done = day <= streak;
        return `<div class="py-1.5 rounded border ${done ? 'bg-amber-400 text-stone-950 border-white' : 'bg-stone-900/90 text-stone-400 border-stone-600'}">
          ${day === 7 ? '👑7' : day === 4 ? '🎁4' : `第${day}日`}
        </div>`;
      }).join('');
    }

    function showFountainCard(badge, title, desc, streak) {
      document.getElementById('oracle-modal').classList.add('hidden');
      document.getElementById('fountain-res-badge').textContent = badge;
      document.getElementById('fountain-res-title').textContent = title;
      document.getElementById('fountain-res-desc').textContent = desc;
      const bar = document.getElementById('streak-bar');
      if (streak) renderStreakBar(streak);
      else bar.classList.add('hidden');
      document.getElementById('fountain-result').classList.remove('hidden');
    }

    function showOracleScroll(badge, level, poem) {
      document.getElementById('fountain-result').classList.add('hidden');
      document.getElementById('oracle-badge').textContent = badge;
      document.getElementById('oracle-level').textContent = `【${level}】`;
      document.getElementById('oracle-poem').textContent = poem;
      document.getElementById('oracle-modal').classList.remove('hidden');
    }

    // === 1. 許願池每日簽到 ===
    async function wishAtFountain() {
      if (isRequesting) return;
      if (!GAS_API_URL) {
        showFountainCard("⚠️ 系統設定提醒", "尚未設定後端連線網址", "請檢查 config.js 中的 GAS_API_URL。", null);
        return;
      }

      isRequesting = true;
      showFountainCard("⛲ 許願池感應中...", "正在向王國登錄今日簽到", "請稍候，水靈正在凝聚祝福資源...", null);

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'dailySign', studentId: player.studentId })
        }).then(r => r.json());

        if (res.success) {
          player.gold = res.totals.gold;
          player.wood = res.totals.wood;
          player.stone = res.totals.stone;
          sessionStorage.setItem('math_town_player', JSON.stringify(player));
          updateHUD();
          showFountainCard(
            `✨ 第 ${res.streak}/7 日簽到成功！`,
            res.rewardTitle,
            `獲得 🪙 +${res.reward.gold}、🪵 +${res.reward.wood}、🪨 +${res.reward.stone}（已同步至雲端存檔）`,
            res.streak
          );
        } else if (res.alreadySigned) {
          showFountainCard(
            "⛲ 許願池已祈福",
            "今天已經領取過水靈祝福囉！",
            `本週累積進度：${res.streak}/7 天（第4天與第7天有大獎，明天再來吧！）`,
            res.streak
          );
        } else {
          showFountainCard("⚠️ 簽到未完成", "後端回傳異常", res.message || "請確認已重新部署最新版 Apps Script。", null);
        }
      } catch (err) {
        showFountainCard("❌ 雲端連線失敗", "本次簽到未計入統計", "網路不穩或後端尚未更新，請重新整理後再試一次！", null);
      } finally {
        isRequesting = false;
      }
    }

    // === 2. 智慧女神像每日求籤（當天抽過直接顯示當天抽到的籤詩） ===
    async function prayToGoddess() {
      if (isRequesting) return;
      if (!GAS_API_URL) {
        showFountainCard("⚠️ 系統設定提醒", "尚未設定後端連線網址", "請檢查 config.js 中的 GAS_API_URL。", null);
        return;
      }

      isRequesting = true;
      showOracleScroll("🔮 智慧女神感應星辰中...", "祈福中", "水晶球正在為你凝聚今日神諭，請稍候...");

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'drawFortune', studentId: player.studentId, nickname: player.nickname })
        }).then(r => r.json());

        if (res.success) {
          const badgeText = res.alreadyDrawn ? "📜 今日已求籤・神諭重現" : "🔮 智慧女神的今日神諭";
          showOracleScroll(badgeText, res.level, res.poem);
        } else {
          showOracleScroll("⚠️ 神諭感應中斷", "提示", res.message || "請確認已重新部署最新版 Apps Script。");
        }
      } catch (err) {
        showOracleScroll("❌ 雲端連線失敗", "斷線", "網路不穩或後端尚未更新，請重新整理後再試一次！");
      } finally {
        isRequesting = false;
      }
    }
  </script>
</body>
</html>
