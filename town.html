<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學奇幻小鎮 - 村莊地圖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <style>
    body { background: #120d0a; color: #f3e5ab; margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
    .rpg-panel { background: linear-gradient(145deg, #2b1d14, #1c120c); border: 3px solid #c89d54; box-shadow: 0 10px 25px rgba(0,0,0,0.85); }
    .rpg-btn { background: linear-gradient(180deg, #e5b567, #b88232); border: 2px solid #fff2cc; color: #231409; font-weight: 900; }
    .hotspot { position: absolute; cursor: pointer; border-radius: 8px; transition: background 0.2s, box-shadow 0.2s; z-index: 10; }
    .hotspot:hover { background: rgba(255, 223, 100, 0.2); box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
    .hotspot-label { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-4px); background: rgba(25,16,10,0.92); border: 1.5px solid #e5b567; color: #ffea9f; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .hotspot:hover .hotspot-label { opacity: 1; }

    /* 巡邏小人走路上下彈跳動畫 */
    @keyframes npcBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .npc-walker {
      position: absolute;
      z-index: 15;
      cursor: pointer;
      transition: left 4s linear, top 4s linear;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .npc-sprite {
      font-size: 24px;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.85));
      animation: npcBob 0.55s infinite ease-in-out;
      transition: transform 0.2s;
    }
    .npc-bubble {
      background: rgba(255, 251, 235, 0.95);
      color: #29180a;
      border: 1.5px solid #b45309;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      margin-bottom: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      pointer-events: none;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">
  <img id="img-town" src="home1.png" alt="小鎮地圖" class="w-full h-full object-contain" style="image-rendering: pixelated;" />
  
  <!-- 建築熱區與巡邏小人共用同一個對齊底圖比例的圖層 -->
  <div id="town-layer" class="absolute"></div>

  <!-- 頂部狀態列 -->
  <div class="absolute top-3 left-3 right-3 flex justify-between items-center pointer-events-none z-20">
    <div class="rpg-panel pointer-events-auto px-4 py-2 rounded-xl flex items-center gap-4 text-sm">
      <span class="text-amber-400 font-black" id="hud-name">勇者</span>
      <span>🪙 <b id="hud-gold">0</b></span>
      <span>🪵 <b id="hud-wood">0</b></span>
      <span>🪨 <b id="hud-stone">0</b></span>
      <span class="text-xs bg-amber-800 px-2.5 py-0.5 rounded-full border border-amber-400" id="hud-stage">Lv.1</span>
    </div>
  </div>

  <!-- 村莊佈告欄特寫彈窗 -->
  <div id="modal-board" class="hidden fixed inset-0 bg-black/85 z-40 flex items-center justify-center p-4">
    <div class="relative w-full max-w-5xl aspect-video flex items-center justify-center">
      <img src="bulletin_board.png" alt="佈告欄" class="w-full h-full object-contain" style="image-rendering: pixelated;" />

      <button onclick="document.getElementById('modal-board').classList.add('hidden')" 
              style="left: 16.7%; top: 13%; width: 13.5%; height: 7.5%;"
              class="absolute bg-red-900/90 hover:bg-red-800 border-2 border-amber-300 text-amber-100 font-black text-xs md:text-sm rounded-xl shadow-lg cursor-pointer flex items-center justify-center">
        ↩ 返回小鎮
      </button>

      <div onclick="petCat()" title="摸摸小橘貓"
           style="left: 74.5%; top: 1.5%; width: 12%; height: 13%;"
           class="absolute cursor-pointer rounded-full hover:bg-amber-300/20 transition flex items-center justify-center">
        <span id="cat-bubble" class="hidden -top-8 absolute bg-amber-100 text-stone-900 text-xs font-black px-2.5 py-1 rounded-full shadow border border-amber-600 whitespace-nowrap">
          喵嗚～加油升級小鎮喔！🐾
        </span>
      </div>

      <div style="left: 16.5%; top: 27.5%; width: 33.5%; height: 55%;"
           class="absolute p-4 overflow-y-auto text-[#3a2210] flex flex-col justify-between">
        <div>
          <h3 id="ann-title" class="font-black text-base md:text-lg border-b-2 border-[#8c5828]/50 pb-1 mb-2">📢 村長公告</h3>
          <p id="ann-content" class="text-xs md:text-sm whitespace-pre-line font-bold leading-relaxed">歡迎來到數學奇幻小鎮！</p>
        </div>
        <div id="ann-date" class="text-[11px] text-[#7a4b22] text-right mt-2"></div>
      </div>

      <div style="left: 52.0%; top: 27.0%; width: 33.5%; height: 56.0%;"
           class="absolute flex flex-col justify-between p-2">
        <div id="msg-list" class="bg-amber-950/85 border border-amber-400 rounded-lg p-2 flex-1 overflow-y-auto space-y-1.5 mb-2"></div>
        <div class="flex gap-1.5">
          <input id="input-msg" type="text" maxlength="40" placeholder="寫下破關心得 (限40字)..." class="flex-1 px-2.5 py-1.5 rounded bg-amber-50 text-stone-900 text-xs font-bold border border-amber-600 focus:outline-none" />
          <button onclick="postMsg()" class="rpg-btn px-3 py-1.5 rounded text-xs cursor-pointer shrink-0">張貼</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 封印建築提示彈窗 -->
  <div id="modal-sealed" class="hidden fixed inset-0 bg-black/75 z-40 flex items-center justify-center p-4">
    <div class="rpg-panel max-w-sm w-full p-6 rounded-2xl text-center">
      <div class="text-4xl mb-2">🚧</div>
      <h3 id="sealed-title" class="text-xl font-black text-amber-300 mb-2">建築封印中</h3>
      <p class="text-sm text-amber-100/85 mb-5">矮人工匠正在施工中，敬請期待後續改版開放！</p>
      <button onclick="document.getElementById('modal-sealed').classList.add('hidden')" class="rpg-btn px-6 py-2 rounded-xl text-sm cursor-pointer">我知道了</button>
    </div>
  </div>

  <script>
    const player = getPlayerSession();
    if (!player) window.location.href = 'index.html';

    const TOWN_HOTSPOTS = [
      { id: "hall",     name: "🏛️ 城鎮中心",     url: "hall.html", left: 41.8, top: 1.9,  width: 16.6, height: 36.3 },
      { id: "tavern",   name: "🍺 冒險者酒館",   url: "",          left: 12.0, top: 8.8,  width: 19.0, height: 33.9 },
      { id: "alchemy",  name: "⚗️ 魔法煉金室",   url: "",          left: 65.3, top: 10.1, width: 21.6, height: 35.8 },
      { id: "fountain", name: "⛲ 中央許願池",   url: "",          left: 43.1, top: 42.1, width: 14.2, height: 17.1 },
      { id: "board",    name: "📋 村莊佈告欄",   url: "MODAL",     left: 55.7, top: 62.6, width: 8.5,  height: 14.3 },
      { id: "ranch",    name: "🐾 奇幻寵物牧場", url: "",          left: 75.1, top: 50.3, width: 19.3, height: 29.7 }
    ];

    document.getElementById('hud-name').textContent = `${player.nickname} (${player.classNum}-${player.seatNum})`;
    document.getElementById('hud-gold').textContent = player.gold;
    document.getElementById('hud-wood').textContent = player.wood;
    document.getElementById('hud-stone').textContent = player.stone;

    const minLv = Math.min(...Object.values(player.buildings));
    const stage = Math.min(3, Math.max(1, minLv));
    document.getElementById('img-town').src = `home${stage}.png`;
    document.getElementById('hud-stage').textContent = stage === 1 ? 'Lv.1 拓荒木屋村' : stage === 2 ? 'Lv.2 石造繁榮鎮' : 'Lv.3 黃金水晶之都';

    const baseRender = initHotspotLayer('img-town', 'town-layer', TOWN_HOTSPOTS, (item) => {
      if (item.url === 'MODAL') {
        openBoard();
      } else if (item.url) {
        window.location.href = item.url;
      } else {
        document.getElementById('sealed-title').textContent = `${item.name}（封印中）`;
        document.getElementById('modal-sealed').classList.remove('hidden');
      }
    });

    // === 巡邏小人系統（依城鎮等級解鎖更多居民在路上散步） ===
    const NPC_LIST = [
      {
        minStage: 1,
        icon: "🧙‍♂️",
        name: "數學老村長",
        waypoints: [{x: 34, y: 46}, {x: 39, y: 58}, {x: 52, y: 60}, {x: 46, y: 40}],
        lines: ["負負得正別忘記！", "快去城鎮中心升級吧！", "今天算了幾題數學？"]
      },
      {
        minStage: 1,
        icon: "🐈",
        name: "小橘貓",
        waypoints: [{x: 62, y: 68}, {x: 70, y: 74}, {x: 58, y: 78}, {x: 53, y: 68}],
        lines: ["喵～佈告欄有新留言！", "喵嗚～好想吃魚乾", "摸我一下會有好運喵！"]
      },
      {
        minStage: 2,
        icon: "🧝‍♀️",
        name: "精靈學者",
        waypoints: [{x: 61, y: 44}, {x: 68, y: 55}, {x: 59, y: 58}, {x: 57, y: 42}],
        lines: ["石造小鎮變好漂亮！", "乘方運算要看清楚括號喔！", "向 Lv.3 水晶之都邁進！"]
      },
      {
        minStage: 3,
        icon: "🛡️",
        name: "皇家衛兵",
        waypoints: [{x: 24, y: 52}, {x: 33, y: 65}, {x: 26, y: 72}, {x: 19, y: 60}],
        lines: ["守護黃金水晶之都！", "你是全班的數學英雄！", "榮譽榜上有你的名字嗎？"]
      }
    ];

    function spawnTownNPCs() {
      const layer = document.getElementById('town-layer');
      const activeNPCs = NPC_LIST.filter(n => stage >= n.minStage);

      activeNPCs.forEach((npc, idx) => {
        let step = 0;
        const el = document.createElement('div');
        el.className = 'npc-walker';
        el.style.left = npc.waypoints[0].x + '%';
        el.style.top = npc.waypoints[0].y + '%';

        const bubble = document.createElement('div');
        bubble.className = 'npc-bubble hidden';
        bubble.textContent = npc.lines[0];

        const sprite = document.createElement('div');
        sprite.className = 'npc-sprite';
        sprite.textContent = npc.icon;

        el.appendChild(bubble);
        el.appendChild(sprite);
        layer.appendChild(el);

        // 點擊小人講話
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          bubble.textContent = npc.lines[Math.floor(Math.random() * npc.lines.length)];
          bubble.classList.remove('hidden');
          setTimeout(() => bubble.classList.add('hidden'), 3000);
        });

        // 定時沿著道路座標巡邏移動
        setInterval(() => {
          const prevX = npc.waypoints[step].x;
          step = (step + 1) % npc.waypoints.length;
          const nextPt = npc.waypoints[step];
          // 根據左右移動方向自動翻轉面向
          sprite.style.transform = nextPt.x < prevX ? 'scaleX(-1)' : 'scaleX(1)';
          el.style.left = nextPt.x + '%';
          el.style.top = nextPt.y + '%';

          // 偶爾自動冒出對話泡泡
          if (Math.random() < 0.35) {
            bubble.textContent = npc.lines[Math.floor(Math.random() * npc.lines.length)];
            bubble.classList.remove('hidden');
            setTimeout(() => bubble.classList.add('hidden'), 2800);
          }
        }, 4200 + idx * 600);
      });
    }

    // 視窗縮放重繪熱區後一併重新生成小人
    window.addEventListener('resize', () => setTimeout(spawnTownNPCs, 100));
    setTimeout(spawnTownNPCs, 300);

    function openBoard() {
      const ann = JSON.parse(sessionStorage.getItem('math_town_ann') || '{}');
      if (ann.title) document.getElementById('ann-title').textContent = ann.title;
      if (ann.content) document.getElementById('ann-content').textContent = ann.content;
      if (ann.updatedAt) document.getElementById('ann-date').textContent = `更新時間：${ann.updatedAt}`;
      renderMsgs();
      document.getElementById('modal-board').classList.remove('hidden');
    }

    function petCat() {
      const bubble = document.getElementById('cat-bubble');
      const lines = ['喵嗚～加油升級小鎮喔！🐾', '多去酒館解題賺木材吧！🪵', '全鎮 Lv.3 會變成水晶之都喔！✨'];
      bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
      bubble.classList.remove('hidden');
      setTimeout(() => bubble.classList.add('hidden'), 2500);
    }

    function renderMsgs() {
      const msgs = JSON.parse(sessionStorage.getItem('math_town_msgs') || '[]');
      const box = document.getElementById('msg-list');
      const colors = ['bg-pink-200 text-pink-950', 'bg-sky-200 text-sky-950', 'bg-amber-200 text-amber-950', 'bg-emerald-200 text-emerald-950'];
      box.innerHTML = msgs.map((m, idx) => `<div class="${colors[idx % colors.length]} p-1.5 rounded shadow text-xs"><b>${m.classNum} ${m.nickname}：</b>${m.content}</div>`).join('');
    }

    async function postMsg() {
      const input = document.getElementById('input-msg');
      const content = input.value.trim();
      if (!content) return;
      const msgs = JSON.parse(sessionStorage.getItem('math_town_msgs') || '[]');
      msgs.unshift({ classNum: player.classNum, nickname: player.nickname, content });
      sessionStorage.setItem('math_town_msgs', JSON.stringify(msgs));
      input.value = '';
      renderMsgs();

      if (GAS_API_URL) {
        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'postMessage', studentId: player.studentId, classNum: player.classNum, nickname: player.nickname, content })
        });
      }
    }
  </script>
</body>
</html>
