<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學奇幻小鎮 - 冒險者報到</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <style>
    body { background: #120d0a; color: #f3e5ab; margin: 0; overflow: hidden; font-family: sans-serif; }
    .rpg-panel { background: linear-gradient(145deg, #2b1d14, #1c120c); border: 3px solid #c89d54; box-shadow: 0 10px 25px rgba(0,0,0,0.85); }
    .rpg-btn { background: linear-gradient(180deg, #e5b567, #b88232); border: 2px solid #fff2cc; color: #231409; font-weight: 900; }
    .tab-active { background: #c89d54; color: #1c120c; font-weight: 900; }
    .tab-inactive { background: #1c120c; color: #c89d54; }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">
  <img src="start_bg.png" alt="起始封面" class="w-full h-full object-contain" style="image-rendering: pixelated;" />

  <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-4">
    <h1 class="text-4xl md:text-5xl font-black text-amber-200 tracking-wider mb-5 drop-shadow-[0_4px_6px_rgba(0,0,0,0.95)]" style="-webkit-text-stroke: 1.5px #3d220a;">
      ⚔️ 數學奇幻小鎮 🏰
    </h1>

    <div class="rpg-panel pointer-events-auto w-full max-w-md p-6 rounded-2xl">
      <!-- 分頁切換標籤 -->
      <div class="grid grid-cols-2 rounded-xl overflow-hidden border-2 border-amber-600 mb-4 text-sm">
        <button id="tab-login" onclick="switchMode('login')" class="tab-active py-2 cursor-pointer transition">
          🔑 已有帳號登入
        </button>
        <button id="tab-register" onclick="switchMode('register')" class="tab-inactive py-2 cursor-pointer transition">
          ✨ 首次報到註冊
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs text-amber-200/80 mb-1">班級 (如 701)</label>
          <input id="input-class" type="text" maxlength="3" placeholder="701" class="w-full px-3 py-2 rounded bg-stone-900 border border-amber-600 text-amber-100" />
        </div>
        <div>
          <label class="block text-xs text-amber-200/80 mb-1">座號 (如 01)</label>
          <input id="input-seat" type="text" maxlength="2" placeholder="01" class="w-full px-3 py-2 rounded bg-stone-900 border border-amber-600 text-amber-100" />
        </div>
      </div>

      <!-- 僅在「首次
